;font-size:18px}.tile span{font-size:11px;color:#aab9c5}#close{width:100%;margin-top:14px;padding:12px;border-radius:9px;border:0;background:var(--cyan);color:#051416;font-weight:900}#hint{position:fixed;bottom:calc(158px + env(safe-area-inset-bottom,0px));right:13px;color:#d9e7ed;font-size:10px;text-align:right;text-shadow:0 2px 5px #000;pointer-events:none}@media(min-width:800px){.stats{top:90px}.rightbuttons{top:100px}.stick{width:150px;height:150px}.knob{left:49px;top:49px}#mission{bottom:24px}#controls{bottom:20px}}

</head><body><div id="game"></div><div id="vignette"></div>
<div id="top"><div><div class="brand">OUTLAW / CITY OF SHADOWS</div><div class="location" id="district">EASTSIDE • BLOCK 09</div></div><div class="cashbox"><small>AVAILABLE CASH</small><span id="cash">$250</span></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fresh={cash:250,hp:100,energy:80,xp:0,level:1,strength:5,defense:4,speed:5,intelligence:3,jobs:0,jobActive:false};let state={...fresh,...JSON.parse(localStorage.getItem('outlaw-save')||'{}')};let toastTimer;

// scene and lighting
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8499a8);scene.fog=new THREE.FogExp2(0x8499a8,.009);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7e9ff,0x33313a,2.1));const sun=new THREE.DirectionalLight(0xffe3bb,3);sun.position.set(-35,65,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});const asphalt=mat(0x303941),sidewalk=mat(0x727779),lineMat=mat(0xe5d8a5),concrete=[0x6c747b,0x85817a,0x4f5a65,0x77706b,0x59656c].map(c=>mat(c)),glass=[0x263d4a,0x314957,0x1d303c].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.28,metalness:.35}));
function box(parent,x,y,z,w,h,d,material,cast=true){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
// city blocks / roads
box(scene,0,-.35,0,180,.5,180,mat(0x3c454b),false);for(let x=-80;x<=80;x+=30){box(scene,x,.01,0,16,.15,180,asphalt,false);for(let z=-82;z<85;z+=10)box(scene,x,.1,z,0.18,.02,4.4,lineMat,false);box(scene,x-9,.16,0,2,.25,180,sidewalk,false);box(scene,x+9,.16,0,2,.25,180,sidewalk,false)}for(let z=-75;z<=75;z+=30){box(scene,0,.01,z,180,.15,16,asphalt,false);box(scene,0,.16,z-9,180,.25,2,sidewalk,false);box(scene,0,.16,z+9,180,.25,2,sidewalk,false)}
// Buildings around blocks with lit window grids
let seed=991;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
for(let x=-75;x<=75;x+=30)for(let z=-75;z<=75;z+=30){if(Math.abs(x)<18&&Math.abs(z)<18)continue;let bx=x+(rnd()-.5)*5,bz=z+(rnd()-.5)*5,w=8+rnd()*8,d=8+rnd()*8,h=9+rnd()*27;let group=new THREE.Group();group.position.set(bx,0,bz);scene.add(group);box(group,0,h/2,w*0+0,w,h,d,concrete[Math.floor(rnd()*concrete.length)]);box(group,0,h+.18,0,w*.35,.36,d*.35,mat(0x30363c));for(let yy=2.5;yy<h-1;yy+=2.5)for(let xx=-w/2+1;xx<w/2-0.5;xx+=1.8){let win=box(group,xx,yy,d/2+.035,.85,1.15,.07,glass[Math.floor(rnd()*glass.length)],false);if(rnd()>.74)win.material=mat(0xd4a65e,.3,.1)}for(let yy=2.5;yy<h-1;yy+=2.5)for(let zz=-d/2+1;zz<d/2;zz+=1.8){let win=box(group,w/2+.035,yy,zz,.07,1.15,.85,glass[Math.floor(rnd()*glass.length)],false);if(rnd()>.8)win.material=mat(0xc3a36b,.3,.1)}}
// street lamps and parked vehicles
for(let x=-60;x<=60;x+=30)for(let z=-60;z<=60;z+=30){box(scene,x+11,2.4,z+10,.16,4.8,.16,mat(0x252c32));let bulb=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),new THREE.MeshBasicMaterial({color:0xffd58a}));bulb.position.set(x+11,4.75,z+10);scene.add(bulb)}
for(let i=0;i<18;i++){let x=(rnd()-.5)*145,z=(rnd()-.5)*145;if(Math.abs(x%30)<10||Math.abs(z%30)<10)continue;let g=new THREE.Group();g.position.set(x,.25,z);g.rotation.y=rnd()*Math.PI;scene.add(g);box(g,0,.45,0,2.1,.8,4.1,mat([0x252b33,0x45545e,0x702e32,0x9b9c96][i%4]));box(g,0,1,0,1.7,.42,1.9,glass,false);for(let sx of [-1,1])for(let sz of [-1,1]){let wh=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.15,12),mat(0x101215));wh.rotation.z=Math.PI/2;wh.position.set(sx*1.02,.24,sz*1.25);g.add(wh)}}
// player: original low-poly streetwear person
const player=new THREE.Group();scene.add(player);const bodyMat=mat(0x17242c),pantsMat=mat(0x20262e),skinMat=mat(0x9a6b50),shoeMat=mat(0x111418),hoodMat=mat(0x253640);let body=box(player,0,1.18,0,.72,.9,.4,bodyMat);let hood=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),hoodMat);hood.position.set(0,1.92,-.01);hood.scale.set(1,1.12,.95);hood.castShadow=true;player.add(hood);let face=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),skinMat);face.position.set(0,1.9,.2);face.scale.set(.9,1,.65);player.add(face);box(player,0,1.67,.02,.56,.22,.44,hoodMat);let legs=[];for(let x of [-.2,.2]){let leg=box(player,x,.56,0,.25,.68,.28,pantsMat);legs.push(leg);box(player,x,.16,.08,.3,.18,.42,shoeMat)}let arms=[];for(let x of [-.48,.48]){let a=box(player,x,1.25,0,.2,.68,.22,bodyMat);a.rotation.z=x<0?-.12:.12;arms.push(a)}
// gold job marker
const marker=new THREE.Group();scene.add(marker);marker.position.set(8,0,-16);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.12,8,28),mat(0xffc44f,.3,.3));ring.rotation.x=Math.PI/2;ring.position.y=.25;marker.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.05,.6,3,16,true),new THREE.MeshBasicMaterial({color:0xffbd43,transparent:true,opacity:.22,side:THREE.DoubleSide}));beam.position.y=1.8;marker.add(beam);const beacon=new THREE.PointLight(0xffb52e,4,10);beacon.position.y=2;marker.add(beacon);
let joy={x:0,y:0},sprinting=false,last=performance.now(),walk=0,camYaw=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});let stick=$('stick'),knob=$('knob'),pointer=null;function setJoy(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.32,len=Math.hypot(dx,dy);if(len>lim){dx=dx/len*lim;dy=dy/len*lim}joy.x=dx/lim;joy.y=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setJoy(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)setJoy(e)});function resetJoy(){pointer=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);$('sprint').addEventListener('pointerdown',()=>sprinting=true);$('sprint').addEventListener('pointerup',()=>sprinting=false);$('sprint').addEventListener('pointercancel',()=>sprinting=false);
function nearMarker(){return Math.hypot(player.position.x-marker.position.x,player.position.z-marker.position.z)<4.3}function interact(){if(state.jobActive&&nearMarker()){state.cash+=120;state.xp+=35;state.jobs++;state.jobActive=false;state.energy=Math.max(0,state.energy-8);if(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;state.hp=100;toast('LEVEL UP! You reached level '+state.level)}else toast('Job complete. +$120 cash, +35 XP');updateUI();save()}else if(!state.jobActive){toast('Accept the available job first.')}else toast('Get closer to the glowing gold pickup marker.')} $('interact').onclick=interact;$('jobbtn').onclick=()=>{if(!state.jobActive){state.jobActive=true;toast('Job accepted. Follow the gold marker!');updateUI()}else interact()};
function openModal(type){$('modal').style.display='flex';if(type==='profile'){$('modalTitle').textContent='CHARACTER PROFILE';$('modalContent').innerHTML=`<p>Build your reputation across the city. Every completed job earns cash and experience.</p><div class="grid"><div class="tile"><strong>${state.level}</strong><span>LEVEL</span></div><div class="tile"><strong>${state.jobs}</strong><span>JOBS COMPLETED</span></div><div class="tile"><strong>${state.strength}</strong><span>STRENGTH</span><button class="ui-btn" data-stat="strength">TRAIN · $50</button></div><div class="tile"><strong>${state.defense}</strong><span>DEFENSE</span><button class="ui-btn" data-stat="defense">TRAIN · $50</button></div><div class="tile"><strong>${state.speed}</strong><span>SPEED</span><button class="ui-btn" data-stat="speed">TRAIN · $50</button></div><div class="tile"><strong>${state.intelligence}</strong><span>INTELLIGENCE</span><button class="ui-btn" data-stat="intelligence">TRAIN · $50</button></div></div>`;document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{if(state.cash<50){toast('You need $50 to train.');return}state.cash-=50;state[b.dataset.stat]++;updateUI();openModal('profile');save()})}else{$('modalTitle').textContent='CITY DISTRICTS';$('modalContent').innerHTML='<p><b>Eastside</b> — Your starting neighborhood. Local jobs are available here.</p><p><b>Market Row</b> — Shops and future equipment vendors.</p><p><b>Industrial Quarter</b> — Higher-risk jobs unlock as you level up.</p><p><b>Downtown</b> — The city’s major opportunities. More content coming soon.</p><p>Your current position is shown by your character in the 3D world.</p>'}}$('profile').onclick=()=>openModal('profile');$('mapbtn').onclick=()=>openModal('map');$('close').onclick=()=>$('modal').style.display='none';$('savebtn').onclick=save;
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;let forward=-(joy.y||0)+(keys.w?1:0)-(keys.s?1:0),side=(joy.x||0)+(keys.d?1:0)-(keys.a?1:0);let len=Math.hypot(forward,side);if(len>1){forward/=len;side/=len}let moving=len>.05;let speed=sprinting&&state.energy>0?8.2:4.8;if(sprinting&&moving)state.energy=Math.max(0,state.energy-13*dt);else state.energy=Math.min(80,state.energy+5*dt);if(moving){let angle=Math.atan2(side,forward);let dx=Math.sin(angle)*speed*dt,dz=Math.cos(angle)*speed*dt; // controls relative to camera's horizontal direction
let yaw=camYaw;let wx=dx*Math.cos(yaw)+dz*Math.sin(yaw),wz=-dx*Math.sin(yaw)+dz*Math.cos(yaw);let nx=clamp(player.position.x+wx,-84,84),nz=clamp(player.position.z+wz,-84,84);player.position.x=nx;player.position.z=nz;player.rotation.y=Math.atan2(wx,wz);walk+=dt*speed*1.6;legs[0].rotation.x=Math.sin(walk)*.55;legs[1].rotation.x=-Math.sin(walk)*.55;arms[0].rotation.x=-Math.sin(walk)*.38;arms[1].rotation.x=Math.sin(walk)*.38}
marker.visible=state.jobActive;marker.rotation.y+=dt*.6;let target=new THREE.Vector3(player.position.x,1.3,player.position.z);let desired=new THREE.Vector3(player.position.x+Math.sin(camYaw)*9,5.3,player.position.z+Math.cos(camYaw)*9);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);let dist=Math.hypot(player.position.x,player.position.z);$('district').textContent=dist<22?'EASTSIDE • BLOCK 09':dist<48?'EASTSIDE • OUTER BLOCKS':'CITY EDGE • EAST DISTRICT';if(state.jobActive&&nearMarker())$('hint').innerHTML='PICKUP IN RANGE<br>TAP INTERACT';else $('hint').innerHTML='DRAG TO MOVE<br>ARROWS FOLLOW CAMERA';updateUI();renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});updateUI();player.position.set(0,0,5);camera.position.set(0,5,14);toast('Welcome to the Eastside. Accept your first job.');requestAnimationFrame(animate);
</script></body></html>
